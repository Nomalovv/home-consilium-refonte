  </g>
  <path d="M96 462h616" stroke="#9C4F30" stroke-width="7" opacity=".45"/>

  <!-- salon de jardin -->
  <rect x="236" y="386" width="132" height="16" rx="8" fill="#2B5049"/>
  <path d="M254 402v42M350 402v42" stroke="#2B5049" stroke-width="9" stroke-linecap="round"/>
  <rect x="400" y="350" width="86" height="54" rx="14" fill="#C77850"/>
  <rect x="400" y="330" width="86" height="32" rx="12" fill="#B5623E"/>
  <path d="M412 404v40M474 404v40" stroke="#9C4F30" stroke-width="9" stroke-linecap="round"/>

  <!-- jardinières -->
