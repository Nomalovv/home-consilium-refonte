  <circle cx="592" cy="338" r="34" fill="#457066" opacity=".75"/>
  <rect x="648" y="368" width="52" height="42" rx="9" fill="#EADFCE"/>
  <circle cx="674" cy="354" r="26" fill="#457066" opacity=".6"/>
  <rect x="150" y="360" width="56" height="48" rx="10" fill="#EADFCE"/>
  <circle cx="178" cy="344" r="30" fill="#457066" opacity=".7"/>
