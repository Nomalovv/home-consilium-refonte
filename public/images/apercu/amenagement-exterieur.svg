<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Illustration d'aperçu : terrasse et jardin</title>
  <defs>
    <linearGradient id="cielExt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF0DA"/>
      <stop offset="1" stop-color="#F8EAE0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cielExt2)"/>
  <circle cx="676" cy="112" r="50" fill="#E8C98A" opacity=".75"/>

  <!-- haie et pelouse -->
  <path d="M0 336c90-30 170-26 260-4s200 20 540-18v92H0z" fill="#457066" opacity=".35"/>
  <rect x="0" y="392" width="800" height="70" fill="#96B7AE" opacity=".45"/>

  <!-- clôture -->
  <g fill="#D9C8B0">
    <rect x="40" y="272" width="18" height="104" rx="6"/>
    <rect x="86" y="272" width="18" height="104" rx="6"/>
    <rect x="132" y="272" width="18" height="104" rx="6"/>
  </g>
  <rect x="32" y="296" width="126" height="12" rx="6" fill="#B5623E" opacity=".7"/>

  <!-- pergola -->
  <rect x="452" y="164" width="300" height="16" rx="8" fill="#9C4F30"/>
  <g stroke="#B5623E" stroke-width="10" stroke-linecap="round">
    <path d="M492 180v52M552 180v52M612 180v52M672 180v52M732 180v52"/>
  </g>
  <path d="M470 180v212M742 180v212" stroke="#9C4F30" stroke-width="14" stroke-linecap="round"/>

  <!-- terrasse en lames -->
  <path d="M96 462h616l56 96H40z" fill="#E3B79E"/>
