    <rect x="580" y="128" width="18" height="48" rx="5"/>
    <rect x="604" y="138" width="16" height="38" rx="5" fill="#C9993F"/>
    <rect x="626" y="122" width="20" height="54" rx="5" fill="#457066"/>
    <rect x="652" y="140" width="15" height="36" rx="5" fill="#E3B79E"/>
  </g>

  <!-- tapis -->
  <ellipse cx="400" cy="512" rx="290" ry="52" fill="#F0D6C5"/>
  <ellipse cx="400" cy="512" rx="230" ry="36" fill="#E3B79E" opacity=".6"/>

  <!-- canapé -->
  <rect x="196" y="322" width="368" height="100" rx="26" fill="#B5623E"/>
  <rect x="182" y="356" width="46" height="110" rx="22" fill="#9C4F30"/>
  <rect x="532" y="356" width="46" height="110" rx="22" fill="#9C4F30"/>
  <rect x="222" y="392" width="316" height="74" rx="20" fill="#C77850"/>
  <rect x="252" y="336" width="72" height="62" rx="16" fill="#E8C98A"/>
  <rect x="436" y="336" width="72" height="62" rx="16" fill="#F3E0B8"/>

  <!-- table basse -->
  <rect x="300" y="472" width="176" height="14" rx="7" fill="#2B5049"/>
