<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Illustration d'aperçu : aménagement intérieur</title>
  <defs>
    <linearGradient id="murInt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EE"/>
      <stop offset="1" stop-color="#F8EAE0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#murInt)"/>
  <rect x="0" y="470" width="800" height="130" fill="#EADFCE"/>
  <path d="M0 470h800" stroke="#B5623E" stroke-width="4" opacity=".3"/>

  <!-- cadres au mur -->
  <rect x="96" y="112" width="116" height="92" rx="10" fill="#F3E0B8"/>
  <rect x="96" y="112" width="116" height="92" rx="10" fill="none" stroke="#9C4F30" stroke-width="7"/>
  <path d="M112 186l32-40 26 30 18-18 28 28" stroke="#457066" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="232" y="132" width="76" height="72" rx="10" fill="none" stroke="#9C4F30" stroke-width="7"/>
  <circle cx="270" cy="168" r="18" fill="#C9993F" opacity=".8"/>

  <!-- étagère -->
  <rect x="560" y="176" width="180" height="12" rx="6" fill="#9C4F30"/>
