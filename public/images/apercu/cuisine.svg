<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Illustration d'aperçu : cuisine</title>
  <defs>
    <linearGradient id="murCuisine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EE"/>
      <stop offset="1" stop-color="#F5EDE1"/>
    </linearGradient>
    <pattern id="carreaux" width="52" height="52" patternUnits="userSpaceOnUse">
      <rect width="52" height="52" fill="#FAF0DA"/>
      <rect x="2" y="2" width="48" height="48" rx="6" fill="#F3E0B8"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#murCuisine)"/>

  <!-- crédence -->
  <rect x="96" y="236" width="608" height="124" fill="url(#carreaux)"/>

  <!-- meubles hauts -->
  <rect x="96" y="96" width="228" height="124" rx="12" fill="#EADFCE"/>
  <rect x="332" y="96" width="120" height="124" rx="12" fill="#EADFCE"/>
  <g fill="#2B5049" opacity=".75">
    <rect x="196" y="150" width="46" height="9" rx="4.5"/>
    <rect x="368" y="150" width="46" height="9" rx="4.5"/>
  </g>

  <!-- hotte -->
  <path d="M520 96h164l-28 78H548z" fill="#457066"/>
  <rect x="548" y="174" width="108" height="16" rx="6" fill="#2B5049"/>

  <!-- plan de travail -->
  <rect x="80" y="352" width="640" height="24" rx="8" fill="#2B5049"/>

  <!-- meubles bas -->
  <rect x="96" y="376" width="288" height="140" rx="12" fill="#B5623E"/>
  <rect x="396" y="376" width="308" height="140" rx="12" fill="#9C4F30"/>
  <g fill="#F8EAE0" opacity=".9">
    <rect x="216" y="424" width="52" height="9" rx="4.5"/>
    <rect x="520" y="424" width="52" height="9" rx="4.5"/>
  </g>
  <rect x="96" y="376" width="288" height="10" fill="#7E3F26" opacity=".35"/>

  <!-- plaque + casserole -->
  <rect x="560" y="340" width="120" height="14" rx="7" fill="#1A322B" opacity=".5"/>
  <path d="M584 300h56a10 10 0 0 1 10 10v22a14 14 0 0 1-14 14h-48a14 14 0 0 1-14-14v-22a10 10 0 0 1 10-10z" fill="#C9993F"/>
  <rect x="648" y="306" width="46" height="9" rx="4.5" fill="#2B5049"/>

  <!-- évier + robinet -->
  <rect x="150" y="330" width="120" height="24" rx="10" fill="#DFEAE5"/>
  <path d="M210 330v-46c0-16 13-28 29-28h12" stroke="#457066" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- plante + bocaux -->
  <rect x="330" y="316" width="34" height="38" rx="8" fill="#E3B79E"/>
  <circle cx="347" cy="300" r="24" fill="#457066" opacity=".8"/>
  <rect x="404" y="312" width="26" height="42" rx="7" fill="#E8C98A"/>
  <rect x="440" y="322" width="26" height="32" rx="7" fill="#F0D6C5"/>

  <rect x="0" y="516" width="800" height="84" fill="#EADFCE"/>
</svg>
